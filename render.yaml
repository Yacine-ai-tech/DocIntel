# Render Blueprint — disaster-recovery / one-click redeploy. Builds from ./Dockerfile (honors $PORT),
# health-checks /health. No secrets here: every key is `sync: false` (set values in the dashboard).
#
# Routes:
#   A (Claude Sonnet Vision)      — works on Render free, needs ANTHROPIC_API_KEY
#   B (Ollama vision, local/self-hosted-remote only — never a third-party API; see .env.example)
#   C (Tesseract OCR + LLM cleanup) — automatic fallback for A/B failures
services:
  - type: web
    name: docintel
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production

      # ─── Route A: Claude Sonnet Vision ──────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_VISION_ROUTE_A
        value: anthropic/claude-sonnet-4-6

      # ─── Route B: Ollama vision (local or your own self-hosted remote) ──
      # See .env.example for the full local/remote reference — Route B never calls a
      # third-party inference API (no Groq, no HF). ROUTE_B_MODE=remote requires
      # ROUTE_B_REMOTE_ENDPOINT to point at Ollama YOU host; leave both unset/local
      # to disable Route B (falls back to Route C automatically).
      - key: ROUTE_B_MODE
        value: local
      - key: OLLAMA_MODEL
        value: qwen2.5vl:7b
      - key: ROUTE_B_REMOTE_ENDPOINT
        sync: false
      - key: ROUTE_B_REMOTE_TOKEN
        sync: false

      # ─── Route C: OCR fallback ───────────────────────────────────────────
      - key: LLM_CLEANUP
        value: anthropic/claude-haiku-4-5

      # ─── General LLM keys (text-only; unrelated to Route B vision) ──────
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

      # ─── Optional: offload large-PDF rendering to a remote host you control ──
      - key: RENDER_URL
        sync: false
      - key: INFERENCE_TOKEN
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ─── Database (optional) ──────────────────────────────────────────────
      # Postgres connection string — batch-job/camera-session state persists here
      # instead of local JSON files when set. Falls back to JSON files with zero
      # configuration if left unset. See .env.example for details.
      - key: POSTGRES_URL
        sync: false

      # Shared bearer secret required on non-exempt routes when
      # REQUIRE_INTERNAL_TOKEN=true — set to any value you choose, keep it secret.
      - key: OMNIINTEL_INTERNAL_TOKEN
        sync: false
      - key: REQUIRE_INTERNAL_TOKEN
        value: "false"

      - key: TELEMETRY_OPT_OUT
        value: "false"
      - key: TELEMETRY_URL
        sync: false
