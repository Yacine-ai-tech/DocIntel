# Render Blueprint — disaster-recovery / one-click redeploy. Builds from ./Dockerfile (honors $PORT),
# health-checks /health. No secrets here: every key is `sync: false` (set values in the dashboard).
# Route A (Claude vision) works on Render free.
# Route B (vision_local/hf/groq) with automatic fallback to Route C (OCR) on failure.
services:
  - type: web
    name: docintel
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ANTHROPIC_API_KEY     # Route A — Claude Sonnet 4.6 Vision
        sync: false
      - key: GROQ_API_KEY          # Route B groq provider / Route C LLM structuring
        sync: false
      - key: HF_TOKEN              # Route B hf provider
        sync: false
      - key: VISION_PROVIDER       # Route B selector: vision_local|hf|groq (all fallback to Route C)
        value: vision_local
      - key: LLM_VISION_LOCAL       # Local vision model (only Llama 3.2 Vision or Qwen 2.5-VL)
        value: ollama/llama-3.2-vision
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OMNIINTEL_INTERNAL_TOKEN  # REQUIRED: must match gateway
        sync: false
      - key: REQUIRE_INTERNAL_TOKEN
        value: "false"
      - key: TELEMETRY_OPT_OUT
        value: "false"