name: Deploy to Render

# Runs after "DocIntel CI & Deploy" (ci.yml) finishes on this same push, not on
# push directly. Previously both this workflow and ci.yml triggered off the same
# push event independently — a commit that failed pytest/lint in ci.yml could
# still have its Docker image built and pushed as :latest here, since GitHub
# Actions doesn't serialize independent workflow files by default. workflow_run
# + the conclusion check below closes that gap: this only runs, and only
# deploys/publishes, once ci.yml's own test/frontend-test/e2e-smoke jobs have
# actually succeeded on this commit.
on:
  workflow_run:
    workflows: ["DocIntel CI & Deploy"]
    types: [completed]
    branches: [main, master, develop]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Trigger Render deploy
        run: |
          code=$(curl -fsS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}') || { echo "deploy trigger failed"; exit 1; }
          echo "Deployment responded HTTP $code"
          cat /tmp/resp.json

  # Publishes the DockerHub image the README/COMMERCIAL positioning promises. Entirely
  # optional — skips cleanly (no failure) if DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo
  # secrets aren't set, so this doesn't break CI for forks or clones without a DockerHub
  # account. Set both in Settings → Secrets → Actions to enable.
  docker-publish:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          || github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check DockerHub credentials are configured
        id: check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — skipping DockerHub publish."
          fi

      - name: Read version from pyproject.toml
        if: steps.check.outputs.configured == 'true'
        id: version
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # The runner's default "docker" driver builder can't export the GHA cache
        # (cache-to: type=gha below) — only the docker-container driver this action sets
        # up can. Without this step the build fails immediately with "Cache export is not
        # supported for the docker driver," before ever reaching the actual build.
        if: steps.check.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docintel:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docintel:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
